# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   target-branch: "dev"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 3
   groups:
     devcontainers:
       patterns:
         - "*"

 - package-ecosystem: "npm"
   target-branch: "dev"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 3
   groups:
     # One weekly PR for all minor/patch bumps. Majors are not grouped, so
     # each one arrives as its own PR for separate review.
     minor-and-patch:
       update-types:
         - "minor"
         - "patch"
   ignore:
     # @astrojs/check's language server crashes under `astro check` on the
     # TypeScript 7 major (see commit ff415a4). Stay on 6.x until it's supported.
     - dependency-name: "typescript"
       update-types: ["version-update:semver-major"]
